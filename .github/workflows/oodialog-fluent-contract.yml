# Architecture: Tom Dyer. Code: ChatGPT (GPT-6).
name: ooDialog Fluent contract
on:
  push:
    branches: ["feature/oodialog-fluent-controls-20261115"]
    paths:
      - "oodialog-fluent/**"
      - ".github/workflows/oodialog-fluent-contract.yml"
  workflow_dispatch:
jobs:
  native-independent-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S oodialog-fluent -B build/oodfluent
      - name: Compile
        run: cmake --build build/oodfluent --config Release
      - name: Test
        run: ctest --test-dir build/oodfluent -C Release --output-on-failure
  winui3-provider-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin official ooRexx native API headers
        uses: actions/checkout@v4
        with:
          repository: ooRexx/ooRexx
          ref: c12e988dc3708846592e20b48350bcdef5b19c60
          path: vendor/oorexx-api
          sparse-checkout: |
            api
      - uses: microsoft/setup-msbuild@v2
      - name: Compile native WinUI 3 provider
        run: msbuild oodialog-fluent/windows/OodFluentWindows.vcxproj -restore -p:Configuration=Release -p:Platform=x64 -m
      - name: Compile Windows native host exercise
        run: msbuild oodialog-fluent/windows/OodFluentSmoke.vcxproj -p:Configuration=Release -p:Platform=x64 -m
      - name: Install pinned Microsoft Windows App Runtime on ephemeral runner
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 3
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "WindowsAppRuntimeInstall-2.6.5-x64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/windowsappsdk/2.6/2.6.5/windowsappruntimeinstall-x64.exe" -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw "Microsoft runtime installer signature verification failed"
          }
          $process = Start-Process -FilePath $installer -ArgumentList '--quiet' -PassThru -Wait
          Write-Output "Windows App SDK 2.6.5 runtime installer exit=$($process.ExitCode)"
          if ($process.ExitCode -ne 0) { throw "Windows App Runtime prerequisite installation failed" }
      - name: Attempt Windows host runtime exercise
        shell: pwsh
        timeout-minutes: 2
        continue-on-error: true
        run: |
          $binary = "oodialog-fluent/windows/x64/Release"
          $env:PATH = "$(Resolve-Path $binary);$env:PATH"
          $env:OODF_LIFECYCLE_TRACE = "1"
          $catalogue = (Resolve-Path "oodialog-fluent/catalogue/controls.tsv").Path
          $results = @()
          $failureCount = 0
          $cases = @('empty:baseline', 'button:baseline', 'toggle:baseline',
                     'info:baseline', 'number:baseline', 'no-number:baseline', 'all:baseline',
                     'info:retain', 'number:retain', 'all:retain',
                     'info:quiesce', 'number:quiesce', 'all:quiesce')
          foreach ($case in $cases) {
            $mode, $experiment = $case.Split(':')
            $env:OODF_SMOKE_MODE = $mode
            $env:OODF_CLOSE_EXPERIMENT = $experiment
            $stdout = "$binary/runtime-$mode-$experiment-stdout.txt"
            $stderr = "$binary/runtime-$mode-$experiment-stderr.txt"
            $process = Start-Process -FilePath "$binary/OodFluentSmoke.exe" -ArgumentList $catalogue -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit(30000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              $results += "MODE $case RUNTIME_TIMEOUT after 30 seconds"
              $failureCount++
              continue
            }
            $process.Refresh()
            $results += "MODE $case exit=$($process.ExitCode)"
            $results += (Get-Content $stdout -Raw)
            $results += (Get-Content $stderr -Raw)
            if ($process.ExitCode -ne 0) { $failureCount++ }
          }
          $results | Set-Content "$binary/runtime-smoke.txt"
          $results | ForEach-Object { Write-Output $_ }
          if ($failureCount -ne 0) { throw "$failureCount Windows runtime mode(s) not qualified" }
      - name: Preserve Windows test candidate
        uses: actions/upload-artifact@v4
        with:
          name: oodialog-fluent-winui3-x64-candidate
          path: |
            oodialog-fluent/windows/x64/Release/OodFluentWindows.dll
            oodialog-fluent/windows/x64/Release/OodFluentWindows.lib
            oodialog-fluent/windows/x64/Release/OodFluentWindows.pri
            oodialog-fluent/windows/x64/Release/Microsoft.WindowsAppRuntime.Bootstrap.dll
            oodialog-fluent/rexx/OodFluent.cls
            oodialog-fluent/windows/x64/Release/OodFluentSmoke.exe
            oodialog-fluent/windows/x64/Release/runtime-smoke.txt
            oodialog-fluent/windows/x64/Release/runtime-*-stdout.txt
            oodialog-fluent/windows/x64/Release/runtime-*-stderr.txt
          if-no-files-found: error
          retention-days: 7
