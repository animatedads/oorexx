# Architecture: Tom Dyer. Code: ChatGPT (GPT-6).
name: ooDialog Fluent contract
on:
  push:
    branches: ["feature/oodialog-fluent-controls-20261115"]
    paths:
      - "oodialog-fluent/**"
      - ".github/workflows/oodialog-fluent-contract.yml"
  workflow_dispatch:
jobs:
  native-independent-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S oodialog-fluent -B build/oodfluent
      - name: Compile
        run: cmake --build build/oodfluent --config Release
      - name: Test
        run: ctest --test-dir build/oodfluent -C Release --output-on-failure
  winui3-provider-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin official ooRexx native API headers
        uses: actions/checkout@v4
        with:
          repository: ooRexx/ooRexx
          ref: c12e988dc3708846592e20b48350bcdef5b19c60
          path: vendor/oorexx-api
          sparse-checkout: |
            api
      - uses: microsoft/setup-msbuild@v2
      - name: Compile native WinUI 3 provider
        run: msbuild oodialog-fluent/windows/OodFluentWindows.vcxproj -restore -p:Configuration=Release -p:Platform=x64 -m
      - name: Compile Windows native host exercise
        run: msbuild oodialog-fluent/windows/OodFluentSmoke.vcxproj -p:Configuration=Release -p:Platform=x64 -m
      - name: Install pinned Microsoft Windows App Runtime on ephemeral runner
        shell: pwsh
        timeout-minutes: 3
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "WindowsAppRuntimeInstall-2.6.5-x64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/windowsappsdk/2.6/2.6.5/windowsappruntimeinstall-x64.exe" -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw "Microsoft runtime installer signature verification failed"
          }
          $process = Start-Process -FilePath $installer -ArgumentList '--quiet' -PassThru -Wait
          Write-Output "Windows App SDK 2.6.5 runtime installer exit=$($process.ExitCode)"
          if ($process.ExitCode -ne 0) { throw "Windows App Runtime prerequisite installation failed" }
      - name: Qualify supported HWND controls and probe unsafe templates
        shell: pwsh
        timeout-minutes: 2
        run: |
          $binary = "oodialog-fluent/windows/x64/Release"
          $env:PATH = "$(Resolve-Path $binary);$env:PATH"
          $env:OODF_LIFECYCLE_TRACE = "1"
          $catalogue = (Resolve-Path "oodialog-fluent/catalogue/controls.tsv").Path
          $results = @()
          $supportedFailures = 0
          $diagnosticFailures = 0
          # Exhaustive teardown experiments are preserved in run 43725003804.
          # Keep recurring CI bounded: four supported modes, three regressions.
          $cases = @('empty:baseline', 'button:baseline', 'toggle:baseline',
                     'guard:default', 'info:baseline', 'number:baseline', 'all:baseline')
          foreach ($case in $cases) {
            $mode, $experiment = $case.Split(':')
            $supported = $mode -in @('empty', 'button', 'toggle', 'guard')
            $env:OODF_SMOKE_MODE = $mode
            if ($mode -eq 'guard') { $env:OODF_ALLOW_UNQUALIFIED_NATIVE = '0' }
            else { $env:OODF_ALLOW_UNQUALIFIED_NATIVE = '1' }
            if ($experiment -in @('retain', 'quiesce')) { $env:OODF_CLOSE_EXPERIMENT = $experiment }
            else { $env:OODF_CLOSE_EXPERIMENT = 'baseline' }
            $env:OODF_PREUNLOAD = $experiment
            $env:OODF_CRASH_DUMP = Join-Path (Resolve-Path $binary).Path "runtime-$mode-$experiment.dmp"
            $stdout = "$binary/runtime-$mode-$experiment-stdout.txt"
            $stderr = "$binary/runtime-$mode-$experiment-stderr.txt"
            $process = Start-Process -FilePath "$binary/OodFluentSmoke.exe" -ArgumentList $catalogue -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit(30000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              $results += "MODE $case RUNTIME_TIMEOUT after 30 seconds"
              if ($supported) { $supportedFailures++ } else { $diagnosticFailures++ }
              continue
            }
            $process.Refresh()
            $results += "MODE $case exit=$($process.ExitCode)"
            $results += (Get-Content $stdout -Raw)
            $results += (Get-Content $stderr -Raw)
            if ($process.ExitCode -ne 0) {
              if ($supported) { $supportedFailures++ } else { $diagnosticFailures++ }
            }
          }
          $results | Set-Content "$binary/runtime-smoke.txt"
          $results | ForEach-Object { Write-Output $_ }
          Write-Output "SUPPORTED_RUNTIME_FAILURES=$supportedFailures DIAGNOSTIC_UNQUALIFIED_FAILURES=$diagnosticFailures"
          if ($supportedFailures -ne 0) { throw "$supportedFailures supported Windows runtime case(s) failed" }
      - name: Reuse verified official ooRexx portable archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/oorexx-verified-5.2.0-portable.zip
          key: oorexx-official-portable-windows-x64-5.2.0-13156-v1
      - name: Probe real ooDialog Rexx session on Windows
        # Exploratory until the downloaded ooRexx runtime and native ooDialog
        # binding are independently verified. This step must not silently be
        # counted as a passing supported-set gate.
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          # Use SourceForge's binary redirector, not the /download HTML
          # landing page (which can return a small non-ZIP response in CI).
          $url = 'https://downloads.sourceforge.net/project/oorexx/oorexx/5.2.0/portable/oorexx-5.2.0-13156.windows.x86_64-portable-release.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'oorexx-verified-5.2.0-portable.zip'
          $incoming = Join-Path $env:RUNNER_TEMP 'oorexx-incoming-5.2.0.zip'
          $unpack = Join-Path $env:RUNNER_TEMP 'oorexx-portable'
          Write-Output 'REXX_PROBE_STAGE=DOWNLOAD_PORTABLE_5_2'
          if (-not (Test-Path $archive)) {
            # SourceForge documents command-line retrieval with curl -L;
            # WebRequest's user agent instead receives HTML on this runner.
            & curl.exe --fail --location --retry 1 --max-time 240 --output $incoming $url
            if ($LASTEXITCODE -ne 0) { throw "SourceForge curl download failed ($LASTEXITCODE)" }
          }
          $candidate = if (Test-Path $archive) { $archive } else { $incoming }
          $bytes = [IO.File]::ReadAllBytes($candidate)
          $signature = [Convert]::ToHexString($bytes[0..([Math]::Min(3, $bytes.Length - 1))])
          Write-Output "REXX_DOWNLOAD_BYTES=$($bytes.Length) SIGNATURE=$signature SHA256=$((Get-FileHash $candidate -Algorithm SHA256).Hash)"
          if ($bytes.Length -lt 5000000 -or -not $signature.StartsWith('504B0304')) {
            throw 'Invalid or incomplete ooRexx portable ZIP from SourceForge'
          }
          $zipCheck = [IO.Compression.ZipFile]::OpenRead($candidate)
          try {
            if ($zipCheck.Entries.Count -lt 20) { throw 'ooRexx portable ZIP has too few entries' }
            Write-Output "REXX_ZIP_ENTRIES=$($zipCheck.Entries.Count)"
          } finally { $zipCheck.Dispose() }
          if (-not (Test-Path $archive)) { Move-Item $incoming $archive }
          Expand-Archive -Path $archive -DestinationPath $unpack -Force
          $rexx = Get-ChildItem $unpack -Recurse -File -Filter 'rexx.exe' | Select-Object -First 1
          $dialogClass = Get-ChildItem $unpack -Recurse -File -Filter 'ooDialog.cls' | Select-Object -First 1
          $dialogDll = Get-ChildItem $unpack -Recurse -File -Filter 'oodialog.dll' | Select-Object -First 1
          if (-not $rexx -or -not $dialogClass -or -not $dialogDll) {
            throw "Portable archive missing component(s): rexx=$([bool]$rexx), ooDialog.cls=$([bool]$dialogClass), oodialog.dll=$([bool]$dialogDll)"
          }
          Write-Output "REXX_PROBE_PATH=$($rexx.FullName)"
          Write-Output "OODIALOG_CLASS=$($dialogClass.FullName)"
          Write-Output "OODIALOG_DLL=$($dialogDll.FullName)"
          $binary = (Resolve-Path 'oodialog-fluent/windows/x64/Release').Path
          $rexxSources = (Resolve-Path 'oodialog-fluent/rexx').Path
          $env:PATH = "$binary;$($rexx.DirectoryName);$($dialogDll.DirectoryName);$env:PATH"
          $env:REXX_PATH = "$rexxSources;$($dialogClass.DirectoryName);$env:REXX_PATH"
          $catalogue = (Resolve-Path 'oodialog-fluent/catalogue/controls.tsv').Path
          $script = (Resolve-Path 'oodialog-fluent/rexx/FluentUserDialogSmoke.rex').Path
          $stdout = Join-Path $binary 'rexx-oodialog-stdout.txt'
          $stderr = Join-Path $binary 'rexx-oodialog-stderr.txt'
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class OodfDialogHarness {
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern IntPtr FindWindow(string className, string windowName);
              [DllImport("user32.dll")]
              public static extern bool PostMessage(IntPtr window, uint message, IntPtr wp, IntPtr lp);
          }
          '@
          Write-Output 'REXX_PROBE_STAGE=START_USER_DIALOG'
          $process = Start-Process -FilePath $rexx.FullName -ArgumentList "`"$script`" `"$catalogue`"" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $posted = $false
          for ($i = 0; $i -lt 80; $i++) {
            $process.Refresh()
            if ($process.HasExited) { break }
            $window = [OodfDialogHarness]::FindWindow($null, 'OodFluent ooDialog Runtime Smoke')
            if ($window -ne [IntPtr]::Zero) {
              $posted = [OodfDialogHarness]::PostMessage($window, 0x111, [IntPtr]1, [IntPtr]::Zero)
              if ($posted) { break }
            }
            Start-Sleep -Milliseconds 250
          }
          if (-not $process.WaitForExit(20000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Write-Output 'REXX_PROBE_TIMEOUT'
          }
          $process.Refresh()
          Write-Output "REXX_PROBE_POSTED_OK=$posted REXX_PROBE_EXIT=$($process.ExitCode)"
          $output = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
          Write-Output $output
          if (Test-Path $stderr) { Get-Content $stderr | ForEach-Object { Write-Output "REXX_STDERR $_" } }
          if ($process.ExitCode -ne 0 -or -not $posted -or
              $output -notmatch 'REXX_SMOKE_STAGE=CONTROLS_READY' -or
              $output -notmatch 'REXX_SMOKE_STAGE=FLUENT_CLOSED' -or
              $output -notmatch 'REXX_SMOKE_PASS=1') {
            throw 'Real ooDialog live-session probe is not yet qualified'
          }
          Write-Output 'REXX_PROBE_PASS=1'
      - name: Inspect Windows crash dump with installed debugger
        if: always()
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 3
        run: |
          $binary = "oodialog-fluent/windows/x64/Release"
          $dump = "$binary/runtime-info-baseline.dmp"
          if (-not (Test-Path $dump)) { Write-Output "NO_DUMP_GENERATED"; exit 0 }
          Write-Output "MINIDUMP_SIZE=$((Get-Item $dump).Length)"
          $cdb = @(
            'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe',
            'C:\Program Files\Windows Kits\10\Debuggers\x64\cdb.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cdb) { Write-Output "CDB_NOT_INSTALLED; minidump preserved as candidate"; exit 0 }
          & $cdb -z (Resolve-Path $dump).Path -c '.symfix; .reload; .ecxr; kv; q' | Select-Object -Last 100
      - name: Preserve Windows test candidate
        uses: actions/upload-artifact@v4
        with:
          name: oodialog-fluent-winui3-x64-candidate
          path: |
            oodialog-fluent/windows/x64/Release/OodFluentWindows.dll
            oodialog-fluent/windows/x64/Release/OodFluentWindows.lib
            oodialog-fluent/windows/x64/Release/OodFluentWindows.pri
            oodialog-fluent/windows/x64/Release/Microsoft.WindowsAppRuntime.Bootstrap.dll
            oodialog-fluent/rexx/OodFluent.cls
            oodialog-fluent/windows/x64/Release/OodFluentSmoke.exe
            oodialog-fluent/windows/x64/Release/runtime-smoke.txt
            oodialog-fluent/windows/x64/Release/runtime-*-stdout.txt
            oodialog-fluent/windows/x64/Release/runtime-*-stderr.txt
            oodialog-fluent/windows/x64/Release/runtime-*.dmp
            oodialog-fluent/windows/x64/Release/rexx-oodialog-*.txt
          if-no-files-found: error
          retention-days: 7
